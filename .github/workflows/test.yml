name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Ensure zsh is available
        # ubuntu-latest ships zsh by default, but the bwrap trap tests exercise
        # real zsh behavior — fail loudly instead of silently skipping coverage
        # if a future runner image drops it.
        run: command -v zsh || (sudo apt-get update && sudo apt-get install -y zsh)
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
